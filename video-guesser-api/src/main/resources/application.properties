spring.application.name=video-guesser-api


# Database config
spring.datasource.url=jdbc:mysql://localhost:3310/videoguesser_db
spring.datasource.username=root
spring.datasource.password=root


# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=

spring.main.banner-mode=off

# Reduce Logging level. Set the logging level to warn
logging.level.root=warn

# Show JPA Hibernate logging messages
# logging.level.org.hibernate.SQL=trace
# .level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.hibernate.orm.deprecation=error

# Porta do Servidor
server.port=8080

youtube.api.key=${YOUTUBE_API_KEY}
jwt.secret=${JWT_SECRET}
app.engine.url=http://localhost:3000

# jackson config
spring.jackson.default-property-inclusion=non_null

