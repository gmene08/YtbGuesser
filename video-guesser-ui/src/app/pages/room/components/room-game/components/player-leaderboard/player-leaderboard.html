<div class="flex justify-start mb-10">
  <h2 class="text-xl font-bold text-gray-800 border-b border-gray-200 pb-1 w-full">
    Player rankings
  </h2>
</div>

<div class="grid grid-cols-1 gap-4">
  @if (matchData(); as match) {
    @for (player of match.playerLeaderboard; track player.userId) {
      <app-player-card
        [playerNickname]="player.nickname"
        [playerId]="player.userId"
        [ownerId]="roomData()?.ownerId"
        [currentUserId]="currentUserId()"
        [isOwner]="isUserOwner()"
        [isDisconnected]="roomData()?.playersWhoDisconnected?.includes(player.userId)"
        [hasGuessed]="playerHasGuessed(player.userId)"
        [isGuessing]="isGuessing()"
        (onKickPlayer)="handleKickPlayer($event)"
      >
        <div score-slot class="flex items-center gap-2">
          @if(roundData()?.roundStatus === RoundStatus.Finished){
            <span class="text-sm text-gray-400">+{{ getPlayerRoundScore(player.userId) }}</span>
          }
          <span class="text-xl font-black">{{ player.totalScore }}</span>
        </div>
      </app-player-card>
    }
  }
</div>
