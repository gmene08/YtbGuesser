@if(roundStatus() === RoundStatus.Finished) {
  <div class="h-64 w-full xl:w-80 flex flex-col justify-between overflow-hidden">
    <div class="flex flex-col gap-4 flex-grow bg-gray-900 rounded-2xl shadow-xl p-5 text-white overflow-hidden">

      <h2 class="flex justify-center mb-2 text-xl font-bold border-b border-gray-700 pb-2">Video Details</h2>

      <div class="flex flex-col flex-grow justify-around gap-3 min-h-0">

        <div class="flex flex-col min-w-0">
          <span class="text-gray-400 text-sm">Video:</span>
          <span class="font-bold truncate text-sm"
                [title]="videoDetails()?.title"
                [innerHTML]="videoDetails()?.title">
          </span>
        </div>

        <div class="flex flex-col min-w-0">
          <span class="text-gray-400 text-sm">Channel:</span>
          <span class="font-normal truncate" [title]="videoDetails()?.channelTitle">
            {{videoDetails()?.channelTitle}}
          </span>
        </div>

        <div class="flex flex-col">
          <span class="text-gray-400 text-sm">View count:</span>
          <span class="font-bold text-red-400 text-lg">
            {{videoDetails()?.viewCount | number}}
          </span>
        </div>

      </div>
    </div>
  </div>
}
@else {
  <div class="w-full xl:w-80 h-64 bg-gray-900 rounded-2xl shadow-xl p-6 text-white flex flex-col items-center justify-center relative overflow-hidden border border-gray-800">
    <div class="text-center z-10 flex flex-col items-center gap-3">
      <span class="text-6xl animate-bounce">🕵️‍♂️</span>
      <h3 class="font-black text-2xl text-gray-100 uppercase tracking-wide">Classified</h3>
      <p class="text-sm text-gray-400 px-4">Wait until the round is finished to reveal the video details.</p>
    </div>
  </div>
  <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
}
