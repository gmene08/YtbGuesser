
@if(roundStatus() === RoundStatus.Finished) {
  <div class="h-full w-full xl:w-80 flex flex-col justify-between gap-6 ">
    <div class="flex flex-col gap-4 flex-grow  bg-gray-900 rounded-2xl shadow-xl p-4 pt-4 text-white">

      <h2 class="flex justify-center mb-2 text-xl">Video Details</h2>

      <div class="flex flex-col flex-grow h-full justify-between gap-3">
        <div class="flex flex-col">Video: <span class="font-normal"> {{videoDetails()?.title}}</span></div>
        <div class="flex flex-col">Channel: <span class="font-normal"> {{videoDetails()?.channelTitle}}</span></div>
        <div class="flex flex-col">View count: <span class="font-normal"> {{videoDetails()?.viewCount}}</span></div>
      </div>

    </div>
  </div>
}
@else {
  <div class="w-full xl:w-80 h-full bg-gray-900 rounded-2xl shadow-xl p-6 text-white flex flex-col items-center justify-center relative overflow-hidden border border-gray-800">
    <div class="text-center z-10 flex flex-col items-center gap-3">
      <span class="text-6xl animate-bounce">🕵️‍♂️</span>
      <h3 class="font-black text-2xl text-gray-100 uppercase tracking-wide">Classified</h3>
      <p class="text-sm text-gray-400 px-4">Wait until the round is finished to reveal the video details.</p>
    </div>
  </div>
  <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
}
