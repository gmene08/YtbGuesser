@if(videoUrl()){
  <youtube-player
    [videoId]="videoUrl()!"
    [width]="playerWidth()"
    [height]="playerHeight()"
    class="absolute inset-0 pointer-events-auto"
    [class.pointer-events-none]="roundStatus() !== 'GUESSING'"
    [playerVars]="playerVars()"
    (ready)="onPlayerReady($event)"
  >
  </youtube-player>
} @else {
  <div class="w-full h-full absolute inset-0 bg-black flex items-center justify-center">
    <span class="text-white text-4xl font-bold">Loading...</span>
  </div>
}
@if (roundStatus() === RoundStatus.Preparing){
  <app-timer
    (onFinish)="startRound()"
    [roundStatus]="roundStatus()"
  ></app-timer>
}

<button
  (click)="toggleMute()"
  class="absolute top-4 right-4 z-40 bg-black/70 hover:bg-black text-white px-4 py-2 rounded-full backdrop-blur-md shadow-lg font-bold flex items-center gap-2 transition-transform transform active:scale-90 pointer-events-auto"
>
  @if (isMuted()) {
    <span class="text-xl animate-pulse">🔇</span>
    <span class="text-sm tracking-widest uppercase">Unmute</span>
  } @else {
    <span class="text-xl">🔊</span>
  }
</button>
