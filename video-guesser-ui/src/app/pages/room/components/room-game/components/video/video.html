<div #videoContainer class="relative w-full aspect-video bg-black overflow-hidden">
  @if(videoUrl()){
    <youtube-player
      [videoId]="videoUrl()!"
      [width]="playerWidth()"
      [height]="playerHeight()"
      class="absolute inset-0 pointer-events-auto"
      [class.pointer-events-none]="roundStatus() !== 'GUESSING'"
      [playerVars]="playerVars()"
      (ready)="onPlayerReady($event)"
    >
    </youtube-player>
  } @else {
    <div class="w-full h-full absolute inset-0 bg-black flex items-center justify-center">
      <span class="text-white text-4xl font-bold animate-pulse">Loading...</span>
    </div>
  }

  @if (roundStatus() === RoundStatus.Preparing){
    <app-prep-timer
      [roundStatus]="roundStatus()"
    ></app-prep-timer>
  }
</div>

<div class="w-full shrink-0 relative z-20 bg-gray-900 border-t border-gray-800 flex items-center px-6 py-3 gap-4 pointer-events-auto">

  <button
    (click)="toggleMute()"
    class="text-white hover:text-red-400 font-black text-2xl transition-transform active:scale-90 focus:outline-none w-8 text-center"
  >
    @if (isMuted()) {
      <span class="text-red-500">🔇</span>
    } @else {
      <span>🔊</span>
    }
  </button>

  <input
    type="range"
    min="0"
    max="100"
    [value]="volume()"
    (input)="onVolumeChange($event)"
    class="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-red-600 hover:accent-red-500 transition-all"
  />

  <span class="text-gray-400 text-sm font-bold w-8 text-right">
    {{ isMuted() ? 0 : volume() }}%
  </span>
</div>
