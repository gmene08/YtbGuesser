<div
  class="w-full text-gray-800 rounded-lg p-4 font-bold flex items-center justify-between group transition-all border shadow-sm overflow-hidden relative"
  [class.bg-red-100]="playerId() === currentUserId()"
  [class.border-red-500]="playerId() === currentUserId()"
  [class.shadow-md]="playerId() === currentUserId()"
  [class.bg-red-50]="playerId() !== currentUserId()"
  [class.border-red-200]="playerId() !== currentUserId()"
  [class.opacity-50]="isDisconnected()"
  [class.grayscale]="isDisconnected()"
  [class.select-none]="isDisconnected()"
>
  <div class="flex items-center gap-2 min-w-0 flex-1">
    @if (playerId() === ownerId()) {
      <span title="Room Owner" class="text-xl shrink-0">👑</span>
    }

    <span class="truncate min-w-0">
      {{ playerNickname() }}
    </span>

    @if (isDisconnected()) {
      <div class="text-red-600 flex items-center animate-pulse" title="Connection lost">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 2.25 19.5 19.5" />
        </svg>
      </div>
    }

    @if (isOwner() && playerId() !== ownerId()) {
      <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <button
          (click)="handleKickPlayer()"
          title="Kick Player"
          class="text-red-400 hover:text-red-700 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm3 10.5a.75.75 0 000-1.5H9a.75.75 0 000 1.5h6z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    }
  </div>

  <div class="flex items-center gap-3 shrink-0 ml-3">
    @if (!isDisconnected()) {
      <div class="shrink-0">
        <ng-content select="[status-slot]"></ng-content>
      </div>
    }

    <ng-content select="[score-slot]"></ng-content>
  </div>
</div>
