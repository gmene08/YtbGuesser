@if(!hasLoadedInitialRoomData()){
  @if(currentUserId() === -1) {
    <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
      <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center gap-6 max-w-md w-full text-center">
        <h1 class="text-3xl md:text-4xl font-black tracking-tight text-gray-800 uppercase select-none">
          Ytb <span class="text-red-600">Guesser</span>
        </h1>
        <h2 class="text-2xl font-black text-gray-800">Choose a nickname to join room <span class="font-bold text-red-600">{{ roomCode() }}</span></h2>

        <div class="w-full ">
          <app-login
            [isUserLoggedIn]="false"
            [userNickname]="null"
            (onLogin)="handleLoginFromLink($event)"
          ></app-login>
        </div>
      </div>
    </div>
  } @else {
    <div class="min-h-screen flex items-center justify-center bg-gray-50">
      <span class="text-red-600 font-bold text-2xl animate-pulse">Loading room...</span>
    </div>
  }
} @else{
  <div class="min-h-screen flex flex-col bg-gray-50">
    @if (!startedGame()) {
      <app-nav-bar></app-nav-bar>
      <div class="flex-grow p-4 md:p-12 pt-4">
        <header>
          <app-room-header
            class="flex flex-col items-center gap-1 mb-6 md:mb-10 group"
            [roomCode]="roomData()?.code"
          >
          </app-room-header>
        </header>

        <main
          class="flex flex-col md:flex-row w-full max-w-5xl mx-auto border-2 border-gray-200 rounded-[2rem] overflow-hidden bg-white shadow-2xl"
        >
          <section class="flex flex-col flex-grow pt-10 p-4 items-center text-red-700">
            <app-room-player-list
              class="flex flex-col justify-between w-full flex-grow"
              [room]="roomData()"
              [isOwner]="isUserOwner()"
              [currentUserId]="currentUserId()"
              (onKickPlayer)="kickPlayer($event)"
              (onLeaveRoom)="leaveRoom()"
            >
            </app-room-player-list>
          </section>

          <aside class="w-full md:w-96 bg-gray-50 border-t-4 md:border-t-0 md:border-l-4 border-gray-200">
            <app-room-settings
              [room]="roomData()"
              [isOwner]="isUserOwner()"
              [startGameErrorMessage]="startGameErrorMessage()"
              [saveMaxPlayersErrorMessage]="saveMaxPlayersErrorMessage()"
              (onStartGame)="startGame($event)"
              (onSaveMaxPlayers)="updateMaxPlayers($event)"
            ></app-room-settings>
          </aside>
        </main>
      </div>
    } @else {
      <app-room-game
        class="h-full flex flex-col flex-grow items-center p-2 md:p-6 gap-6"
        [roomData]="roomData()"
        (kickPlayer)="kickPlayer($event)"
        (onLeaveRoom)="leaveRoom()"
      >
      </app-room-game>
    }
  </div>
}
