@if (!isLoading()) {
  <div class="min-h-screen bg-white flex flex-col text-red-700 font-youtube">
    <app-nav-bar class="text-gray-900"></app-nav-bar>

    <div class="flex-grow flex flex-col items-center justify-start pt-4 text-center px-4 gap-10">
      <div class="flex flex-col items-center">
        <h1 class="text-6xl md:text-7xl font-bold tracking-tight text-red-700">Ytb Guesser</h1>

        <h3 class="text-xl md:text-2xl text-gray-500 max-w-2xl">Guess the view count of videos</h3>
      </div>

      <div class="flex flex-col items-center gap-10">
        <app-login
          [isUserLoggedIn]="isUserLoggedIn()"
          [userNickname]="userNickname()"
          (onLogin)="handleLogin($event)"
        ></app-login>

        @if (roomUserIsIn()){
          <app-reconnect
            (onReconnect)="handleReconnect()"
            (onLeaveRoom)="handleLeaveRoom()"
          >
          </app-reconnect>
        } @else {
          <app-menu
            [isLoggedIn]="isUserLoggedIn()"
            (onJoinRoom)="handleJoinRoom($event)"
            (onCreateRoom)="handleCreateRoom()"
          ></app-menu>
        }

      </div>
    </div>
  </div>
}
