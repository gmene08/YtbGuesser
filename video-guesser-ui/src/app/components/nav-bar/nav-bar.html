<div class="grid grid-cols-3 items-center px-8 py-4 bg-white border-b border-gray-200 select-none">

  <div class="font-bold text-2xl tracking-tighter text-gray-800">
    Yg.
  </div>

  <div class="flex items-center justify-center gap-3">
    @if(userId() != -1){
      <span class="bg-gray-100 text-gray-700 font-bold px-4 py-1.5 rounded-full text-sm border border-gray-200">
        {{ userNickname() }}
      </span>


      <button
        (click)="logout()"
        class="flex items-center justify-center w-8 h-8 text-gray-500 hover:text-red-600 bg-gray-50 hover:bg-red-50 border border-gray-200 hover:border-red-100 rounded-full transition-all duration-200 active:scale-95 shadow-sm cursor-pointer"
        title="Logout"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
        </svg>
      </button>
    }
  </div>

  <div></div>

</div>
