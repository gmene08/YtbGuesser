# Block 1: Redirects normal HTTP traffic (Port 80) to secure HTTPS
server {
    listen 80;
    server_name ytbguesser.com.br www.ytbguesser.com.br;
    
    return 301 https://$host$request_uri;
}

# Block 2: The actual Secure HTTPS Server (Port 443)
server {
    listen 443 ssl;
    server_name ytbguesser.com.br www.ytbguesser.com.br;

    # SSL Certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/ytbguesser.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ytbguesser.com.br/privkey.pem;

    # Modern encryption protocols for browser compatibility and security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Angular Routing handling (Prevents 404 errors when refreshing the page)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Production Proxy: forwards all /api requests to the Java backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Proxy: maintains active full-duplex communication tunnels
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; 
        proxy_set_header Host $host;
    }
}